* { margin: 0; padding: 0; box-sizing: border-box; }

body {

  background: #0f1117;
  color: #e0e0e0;
  line-height: 1.6;
}

.header {
  background: linear-gradient(135deg, #1a1f2e 0%, #16213e 100%);
  padding: 40px 20px;
  text-align: center;
  border-bottom: 3px solid #3498db;
}

.header h1 {
  font-size: 2.2em;
  color: #3498db;
  margin-bottom: 8px;
}

.header p {
  color: #8892a4;
  font-size: 1.1em;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 20px 0 30px;
  flex-wrap: wrap;
}

.stat {
  background: #1a1f2e;
  padding: 15px 25px;
  border-radius: 10px;
  text-align: center;
  border: 1px solid #2a3040;
}

.stat .number {
  font-size: 1.8em;
  font-weight: 700;
  color: #3498db;
}

.stat .label {
  font-size: 0.85em;
  color: #8892a4;
  margin-top: 4px;
}

.modulo-section {
  margin-bottom: 40px;
}

.modulo-title {
  font-size: 1.5em;
  color: #3498db;
  padding: 12px 20px;
  background: #1a1f2e;
  border-radius: 10px 10px 0 0;
  border-left: 4px solid #3498db;
  display: flex;
  align-items: center;
  gap: 10px;
}

.modulo-count {
  font-size: 0.7em;
  background: #3498db;
  color: #fff;
  padding: 3px 10px;
  border-radius: 20px;
  margin-left: 10px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 16px;
  padding: 20px;
  background: #151922;
  border-radius: 0 0 10px 10px;
}

.video-card {
  background: #1a1f2e;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #2a3040;
  transition: transform 0.2s, border-color 0.2s;
}

.video-card:hover {
  transform: translateY(-2px);
  border-color: #3498db;
}

.video-card video {
  width: 100%;
  background: #000;
  display: block;
}

.video-info {
  padding: 12px 16px;
}

.video-info .aula-titulo {
  font-weight: 600;
  color: #e0e0e0;
  font-size: 0.95em;
  margin-bottom: 4px;
}

.video-info .aula-meta {
  font-size: 0.8em;
  color: #6b7a90;
}

.video-controls {
  padding: 8px 16px 12px;
  display: flex;
  gap: 8px;
}

.btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid #2a3040;
  background: #1e2433;
  color: #8892a4;
  cursor: pointer;
  font-size: 0.8em;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
}

.btn:hover {
  background: #2a3040;
  color: #3498db;
  border-color: #3498db;
}

.btn.primary {
  background: #3498db;
  color: #fff;
  border-color: #3498db;
}

.btn.primary:hover {
  background: #2980b9;
}

.empty-modulo {
  padding: 40px 20px;
  text-align: center;
  color: #6b7a90;
  background: #151922;
  border-radius: 0 0 10px 10px;
}

.footer {
  text-align: center;
  padding: 30px;
  color: #4a5568;
  font-size: 0.85em;
  border-top: 1px solid #1a1f2e;
  margin-top: 20px;
}

/* --- Video ZIP Download --- */
.btn-video-zip {
  padding: 7px 16px;
  border-radius: 6px;
  border: 1px solid #7c3aed;
  background: linear-gradient(135deg, #1a1028 0%, #1a1f2e 100%);
  color: #a78bfa;
  cursor: pointer;
  font-size: 0.82em;
  font-weight: 600;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
  margin-left: auto;
}
.btn-video-zip:hover {
  background: linear-gradient(135deg, #2a1a40 0%, #222940 100%);
  border-color: #8b5cf6;
  color: #c4b5fd;
  transform: translateY(-1px);
}
.btn-video-zip:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.video-zip-progress {
  display: none;
  margin: 8px 20px 12px;
  padding: 10px 14px;
  background: #1a1028;
  border-radius: 8px;
  border: 1px solid #2a2050;
}
.video-zip-progress.active { display: block; }
.video-zip-progress .vz-bar-bg {
  height: 6px;
  background: #2a2050;
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}
.video-zip-progress .vz-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #7c3aed, #a78bfa);
  border-radius: 3px;
  transition: width 0.3s ease;
  width: 0%;
}
.video-zip-progress .vz-text { font-size: 0.78em; color: #a78bfa; }
.video-zip-progress .vz-done { color: #27ae60; font-weight: 600; }

/* --- PDF Download Section --- */

.pdf-section h2 {

.pdf-modulo {

  color: #fff;

  border-radius: 20px;

.pdf-modulo-title .pdf-toggle {

  font-size: 0.9em;
  transition: transform 0.3s;
}

.pdf-modulo-title.open .pdf-toggle {
  transform: rotate(90deg);
}

.pdf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 10px;
  padding: 0 10px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease, padding 0.3s;
}

.pdf-grid.expanded {
  max-height: 10000px;
  padding: 8px 10px 16px;
}

.pdf-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #151922;
  border: 1px solid #2a3040;
  border-radius: 8px;
  padding: 10px 14px;
  transition: all 0.2s;
  text-decoration: none;
  color: #e0e0e0;
}

.pdf-item:hover {
  border-color: #27ae60;
  background: #1a2520;
  transform: translateY(-1px);
}

.pdf-item .pdf-icon {
  font-size: 1.5em;
  flex-shrink: 0;
}

.pdf-item .pdf-info {

  min-width: 0;
}

.pdf-item .pdf-name {
  font-size: 0.85em;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pdf-item .pdf-meta {
  font-size: 0.7em;
  color: #6b7a90;
  margin-top: 2px;

.pdf-item .pdf-download {
  color: #27ae60;

  opacity: 0.7;
  transition: opacity 0.2s;

.pdf-item:hover .pdf-download {

@media (max-width: 768px) {

  .pdf-grid { grid-template-columns: 1fr; }

.btn-zip {

.zip-progress .zip-bar-bg {

  background: #2a3040;

  margin-top: 6px;

.zip-progress .zip-bar-fill {

  border-radius: 3px;
  transition: width 0.3s ease;
  width: 0%;
}
.zip-progress .zip-text { font-size: 0.78em; color: #8892a4; }
.zip-progress .zip-done { color: #27ae60; font-weight: 600; }
</style>
</head>

    .replace(/[^\w\sáéíóúãõâêîôûàèìòùçÁÉÍÓÚÃÕÂÊÎÔÛÀÈÌÒÙÇ-]/g, '')
    .replace(/\s+/g, '_')
    .substring(0, 60);
  
  modulosDiv.innerHTML += `
    <div class="modulo-section">
      <div class="modulo-title">
        ${mod.name}
        <span class="modulo-count">${mod.videos.length} vídeos</span>
        <button id="btnVideoZip${modId}" class="btn-video-zip" onclick="downloadVideoZipModule('${modId}')" title="Baixar todos os vídeos deste módulo em ZIP">
          🎬 Baixar Vídeos ZIP
        </button>
      </div>
      <div class="video-zip-progress" id="videoZipProgress${modId}">
        <span class="vz-text">Preparando ZIP de vídeos...</span>
        <div class="vz-bar-bg"><div class="vz-bar-fill"></div></div>

});

// ============================================================
// FUNCTION: Download ZIP of a module's VIDEOS using JSZip
// ============================================================
async function downloadVideoZipModule(modId) {
  const videos = VIDEOS.filter(v => String(v.modulo_id) === String(modId));
  if (videos.length === 0) { alert('Nenhum vídeo neste módulo.'); return; }
  
  const totalMB = videos.reduce((sum, v) => sum + (v.size_mb || 0), 0);
  const sizeText = totalMB > 0 ? `~${totalMB.toFixed(0)} MB` : 'tamanho desconhecido';
  
  const confirmed = confirm(
    `⚠️ Atenção: Este ZIP conterá ${videos.length} vídeos (${sizeText}).\n\n` +
    `O download pode demorar bastante (vários minutos), pois cada vídeo precisa ser carregado na memória do navegador.\n\n` +
    `⚠️ Arquivo grande (${sizeText}). Recomendamos usar uma conexão estável.\n\n` +
    `Deseja continuar?`
  );
  if (!confirmed) return;
  
  const progressDiv = document.getElementById('videoZipProgress' + modId);
  if (!progressDiv) return;
  const textEl = progressDiv.querySelector('.vz-text');
  const barFill = progressDiv.querySelector('.vz-bar-fill');
  const btn = document.getElementById('btnVideoZip' + modId);
  
  btn.disabled = true;
  btn.textContent = '⏳ Gerando...';
  progressDiv.classList.add('active');
  textEl.textContent = `⚠️ Arquivo grande (~${totalMB.toFixed(0)} MB). O download pode demorar. Iniciando...`;
  barFill.style.width = '0%';
  
  try {
    const zip = new JSZip();
    const total = videos.length;
    let completed = 0, failed = 0;
    
    for (let i = 0; i < videos.length; i++) {
      const video = videos[i];
      try {
        textEl.textContent = `⬇ [${i + 1}/${total}] Baixando: ${video.filename} (${(video.size_mb||0).toFixed(1)} MB)...`;
        const response = await fetch(video.filename);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        zip.file(video.filename, blob, { binary: true });
        completed++;
      } catch (err) {
        failed++;
        console.warn(`Falha ao baixar ${video.filename}:`, err);
      }
      const pct = Math.round(((completed + failed) / total) * 90);
      barFill.style.width = pct + '%';
    }
    
    if (completed === 0) throw new Error('Nenhum vídeo pôde ser baixado.');
    
    textEl.textContent = '🗜️ Gerando arquivo ZIP (isso pode demorar com arquivos grandes)...';
    barFill.style.width = '95%';
    
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    const mod = modulos[modId];
    const safeName = mod ? mod.name.replace(/[^\w\sáéíóúãõâêîôûàèìòùçÁÉÍÓÚÃÕÂÊÎÔÛÀÈÌÒÙÇ-]/g, '').replace(/\s+/g, '_').substring(0, 50) : `Modulo_${modId}`;
    a.download = `Videos_${safeName}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    barFill.style.width = '100%';
    const zipMB = (zipBlob.size / (1024 * 1024)).toFixed(1);
    textEl.innerHTML = `<span class="vz-done">✅ ZIP gerado com sucesso! (${zipMB} MB, ${completed} vídeos)</span>`;
    if (failed > 0) textEl.innerHTML += ` <span style="color:#e74c3c">⚠️ ${failed} falhas.</span>`;
  } catch (err) {
    console.error('Erro ao gerar ZIP de vídeos:', err);
    textEl.innerHTML = `<span style="color:#e74c3c">❌ Erro: ${err.message}</span>`;
    barFill.style.width = '0%';
  } finally {
    btn.disabled = false;
    btn.textContent = '🎬 Baixar Vídeos ZIP';
  }
}

// ============================================================
// FUNCTION: Download ZIP of a module's PDFs using JSZip
// ============================================================
async function downloadZipModule(modId, zipFileName) {
  const mod = PDFS_MODULOS.find(m => m.id === modId);
  if (!mod) { alert('Módulo não encontrado.'); return; }
  
  const progressDiv = document.getElementById('zipProgress' + modId);
  const textEl = progressDiv.querySelector('.zip-text');
  const barFill = progressDiv.querySelector('.zip-bar-fill');
  const btn = document.getElementById('btnZip' + modId);
  
  btn.disabled = true;
  btn.innerHTML = '⏳ Gerando...';
  progressDiv.classList.add('active');
  textEl.textContent = `Iniciando download de ${mod.pdfs.length} PDFs...`;
  barFill.style.width = '0%';
  
  try {
    const zip = new JSZip();
    const total = mod.pdfs.length;
    let completed = 0, failed = 0;
    
    for (const pdf of mod.pdfs) {
      try {
        const response = await fetch(pdf.path);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        zip.file(pdf.filename, blob, { binary: true });
        completed++;
      } catch (err) {
        failed++;
        console.warn(`Falha ao baixar ${pdf.filename}:`, err);
      }
      const pct = Math.round(((completed + failed) / total) * 100);
      barFill.style.width = pct + '%';
      textEl.textContent = `📦 ${completed + failed} de ${total} PDFs processados...`;
    }
    
    if (completed === 0) throw new Error('Nenhum PDF pôde ser baixado.');
    
    textEl.textContent = '🗜️ Gerando arquivo ZIP...';
    barFill.style.width = '95%';
    
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url; a.download = zipFileName;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    barFill.style.width = '100%';
    const totalMB = (zipBlob.size / (1024 * 1024)).toFixed(1);
    textEl.innerHTML = `<span class="zip-done">✅ ZIP gerado com sucesso! (${totalMB} MB, ${completed} PDFs)</span>`;
    if (failed > 0) textEl.innerHTML += ` <span style="color:#e74c3c">⚠️ ${failed} falhas.</span>`;
  } catch (err) {
    console.error('Erro ao gerar ZIP:', err);
    textEl.innerHTML = `<span style="color:#e74c3c">❌ Erro: ${err.message}</span>`;
    barFill.style.width = '0%';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="zip-icon">📥</span> Baixar ZIP';
  }
}

// ============================================================
// SECTION: PDF Downloads
// ============================================================
if (typeof PDFS_MODULOS !== 'undefined' && PDFS_MODULOS.length > 0) {
  const pdfSection = document.getElementById('pdfModulos');
  
  PDFS_MODULOS.forEach(mod => {
    let pdfItems = '';
    mod.pdfs.forEach(pdf => {
      const displayName = pdf.file_id
        ? `📄 Aula ${pdf.file_id}.pdf`
        : pdf.filename.replace(/\.pdf$/i, '');
      const meta = pdf.size_kb >= 1000
        ? `${(pdf.size_kb / 1000).toFixed(1)} MB`
        : `${pdf.size_kb} KB`;
      
      pdfItems += `
        <a href="${pdf.path}" class="pdf-item" download>
          <span class="pdf-icon">📕</span>
          <span class="pdf-info">
            <span class="pdf-name" title="${pdf.filename}">${displayName}</span>
            <span class="pdf-meta">${meta}</span>
          </span>
          <span class="pdf-download">⬇</span>
        </a>`;
    });
    
    const zipSafeName = mod.name
      .replace(/[📋📚🏗️🏘️🤝📄📊]/g, '').trim()
      .replace(/Módulo\s*\d+\s*-\s*/, '')
      .replace(/\s+/g, '_')
      .replace(/[^a-zA-Z0-9_]/g, '');
    const zipFileName = `Modulo_${mod.id}_${zipSafeName}.zip`;
    
    const modDiv = document.createElement('div');
    modDiv.className = 'pdf-modulo';
    modDiv.innerHTML = `
      <div class="pdf-modulo-title" onclick="this.classList.toggle('open'); this.parentElement.querySelector('.pdf-grid').classList.toggle('expanded')">
        <span>${mod.name}</span>
        <span class="pdf-count">${mod.pdfs.length} PDFs</span>
        <button id="btnZip${mod.id}" class="btn-zip" onclick="event.stopPropagation(); downloadZipModule('${mod.id}', '${zipFileName}')" title="Baixar todos os PDFs deste módulo em ZIP">
          <span class="zip-icon">📥</span> Baixar ZIP
        </button>
        <span class="pdf-toggle">▶</span>
      </div>
      <div class="zip-progress" id="zipProgress${mod.id}">
        <span class="zip-text">Preparando ZIP...</span>
        <div class="zip-bar-bg"><div class="zip-bar-fill"></div></div>
      </div>
      <div class="pdf-grid expanded">${pdfItems}</div>
    `;
    pdfSection.appendChild(modDiv);
  });
}
</script>
