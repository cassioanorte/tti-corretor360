<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTI | Corretor 360 - Vídeos do Curso</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0f1117;
  color: #e0e0e0;
  line-height: 1.6;
}

.header {
  background: linear-gradient(135deg, #1a1f2e 0%, #16213e 100%);
  padding: 40px 20px;
  text-align: center;
  border-bottom: 3px solid #3498db;
}

.header h1 {
  font-size: 2.2em;
  color: #3498db;
  margin-bottom: 8px;
}

.header p {
  color: #8892a4;
  font-size: 1.1em;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 20px 0 30px;
  flex-wrap: wrap;
}

.stat {
  background: #1a1f2e;
  padding: 15px 25px;
  border-radius: 10px;
  text-align: center;
  border: 1px solid #2a3040;
}

.stat .number {
  font-size: 1.8em;
  font-weight: 700;
  color: #3498db;
}

.stat .label {
  font-size: 0.85em;
  color: #8892a4;
  margin-top: 4px;
}

.modulo-section {
  margin-bottom: 40px;
}

.modulo-title {
  font-size: 1.5em;
  color: #3498db;
  padding: 12px 20px;
  background: #1a1f2e;
  border-radius: 10px 10px 0 0;
  border-left: 4px solid #3498db;
  display: flex;
  align-items: center;
  gap: 10px;
}

.modulo-count {
  font-size: 0.7em;
  background: #3498db;
  color: #fff;
  padding: 3px 10px;
  border-radius: 20px;
  margin-left: 10px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 16px;
  padding: 20px;
  background: #151922;
  border-radius: 0 0 10px 10px;
}

.video-card {
  background: #1a1f2e;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #2a3040;
  transition: transform 0.2s, border-color 0.2s;
}

.video-card:hover {
  transform: translateY(-2px);
  border-color: #3498db;
}

.video-card video {
  width: 100%;
  background: #000;
  display: block;
}

.video-info {
  padding: 12px 16px;
}

.video-info .aula-titulo {
  font-weight: 600;
  color: #e0e0e0;
  font-size: 0.95em;
  margin-bottom: 4px;
}

.video-info .aula-meta {
  font-size: 0.8em;
  color: #6b7a90;
}

.video-controls {
  padding: 8px 16px 12px;
  display: flex;
  gap: 8px;
}

.btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid #2a3040;
  background: #1e2433;
  color: #8892a4;
  cursor: pointer;
  font-size: 0.8em;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
}

.btn:hover {
  background: #2a3040;
  color: #3498db;
  border-color: #3498db;
}

.btn.primary {
  background: #3498db;
  color: #fff;
  border-color: #3498db;
}

.btn.primary:hover {
  background: #2980b9;
}

.empty-modulo {
  padding: 40px 20px;
  text-align: center;
  color: #6b7a90;
  background: #151922;
  border-radius: 0 0 10px 10px;
}

.footer {
  text-align: center;
  padding: 30px;
  color: #4a5568;
  font-size: 0.85em;
  border-top: 1px solid #1a1f2e;
  margin-top: 20px;
}

/* --- PDF Download Section --- */
.pdf-section {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 2px solid #2a3040;
}

.pdf-section h2 {
  font-size: 1.6em;
  color: #3498db;
  margin-bottom: 25px;
  text-align: center;
}

.pdf-modulo {
  margin-bottom: 30px;
}

.pdf-modulo-title {
  font-size: 1.15em;
  color: #e0e0e0;
  background: #1a1f2e;
  padding: 14px 20px;
  border-radius: 10px;
  border-left: 4px solid #27ae60;
  margin-bottom: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.2s;
}

.pdf-modulo-title:hover {
  background: #222940;
}

.pdf-modulo-title .pdf-count {
  font-size: 0.8em;
  background: #27ae60;
  color: #fff;
  padding: 3px 12px;
  border-radius: 20px;
}

.pdf-modulo-title .pdf-toggle {
  color: #6b7a90;
  font-size: 0.9em;
  transition: transform 0.3s;
}

.pdf-modulo-title.open .pdf-toggle {
  transform: rotate(90deg);
}

.pdf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 10px;
  padding: 0 10px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease, padding 0.3s;
}

.pdf-grid.expanded {
  max-height: 10000px;
  padding: 8px 10px 16px;
}

.pdf-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #151922;
  border: 1px solid #2a3040;
  border-radius: 8px;
  padding: 10px 14px;
  transition: all 0.2s;
  text-decoration: none;
  color: #e0e0e0;
}

.pdf-item:hover {
  border-color: #27ae60;
  background: #1a2520;
  transform: translateY(-1px);
}

.pdf-item .pdf-icon {
  font-size: 1.5em;
  flex-shrink: 0;
}

.pdf-item .pdf-info {
  flex: 1;
  min-width: 0;
}

.pdf-item .pdf-name {
  font-size: 0.85em;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pdf-item .pdf-meta {
  font-size: 0.7em;
  color: #6b7a90;
  margin-top: 2px;
}

.pdf-item .pdf-download {
  color: #27ae60;
  font-size: 1.2em;
  flex-shrink: 0;
  opacity: 0.7;
  transition: opacity 0.2s;
}

.pdf-item:hover .pdf-download {
  opacity: 1;
}

@media (max-width: 768px) {
  .header h1 { font-size: 1.5em; }
  .video-grid { grid-template-columns: 1fr; padding: 10px; }
  .stats { gap: 10px; }
  .stat { padding: 10px 15px; }
  .stat .number { font-size: 1.3em; }
  .pdf-grid { grid-template-columns: 1fr; }
}
</style>
</head>

      const meta = pdf.size_kb >= 1000

        : `${pdf.size_kb} KB`;
